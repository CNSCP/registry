# Additional Secrets needed after the namespace is created
#
#   kubectl -n cp-registry create secret docker-registry ghcr-token \
#     --docker-server=ghcr.io \
#     --docker-username=mindovermiles262 \
#     --docker-password=YOUR_GITHUB_PAT \
#     --docker-email=andy@padi.io
#
#   kubectl -n cp-registry create secret generic registry-db \
#     --from-literal=POSTGRES_USER=registry \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 24)" \
#     --from-literal=POSTGRES_DB=cp_registry
#
#   kubectl -n cp-registry create secret generic registry-auth \
#     --from-literal=INTERNAL_SEAM_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=CP_AUTHOR_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=CP_AUTHOR_USER_ID="<uuid — created by the bootstrap Job's SQL, see DEPLOY.md>"
#
# The author credential mirrors the local setup: kind=agent, principal names
# the human (§4.3), scopes decide what it may do (§15.2).

apiVersion: v1
kind: Namespace
metadata:
  name: cp-registry
