---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-http-production
spec:
  acme:
    email: andy@padi.io
    privateKeySecretRef:
      name: letsencrypt-http-production
    server: https://acme-v02.api.letsencrypt.org/directory
    solvers:
      - http01:
          ingress:
            class: istio
        selector: {}
