---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cnscpio-cp-registry
  namespace: cnscp-registry
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`cp.cnscp.io`)
      kind: Rule
      services:
        - name: registry
          port: 80
  tls:
    secretName: cp-cnscp-io-ssl-certificate

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: cnscp-registry
spec:
  redirectScheme:
    scheme: https
    permanent: true

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cnscpio-cp-registry-http
  namespace: cnscp-registry
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`cp.cnscp.io`)
      kind: Rule
      middlewares:
        - name: redirect-https
      services:
        - name: registry
          port: 80

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cp-registry
  namespace: cnscp-registry
spec:
  commonName: cp.cnscp.io
  dnsNames:
  - cp.cnscp.io
  issuerRef:
    name: letsencrypt-http
    kind: ClusterIssuer
  secretName: cp-cnscp-io-ssl-certificate
