# The authoritative host — cp.cnscp.io (§4.4).
#
# One Deployment serving the AUTHORITATIVE profile: every GET of §19 plus the
# authoring verbs of §15, on one origin. Write verbs are bearer-token gated;
# the resolution surface is public by design and answers "without regard to
# the identity of the party presenting a name" (spec §9.3).
#
# Replicas: 2 for restarts-without-downtime. Both point at one Postgres —
# publication serializes on a row lock (§13.4), so replicas are safe.

apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: cp-registry
spec:
  selector:
    app: registry
  ports:
    - port: 80
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: cp-registry
spec:
  replicas: 2
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      imagePullSecrets:
        - name: ghcr-token
      containers:
        - name: registry
          image: ghcr.io/cnscp/registry:latest
          ports:
            - containerPort: 8082
          env:
            - name: BIND_HOST
              value: '0.0.0.0'
            - name: CP_PORT
              value: '8082'
            # No CP_AUTHOR_* since 12 Sept 2026: every credential is a row,
            # minted by its owner on /account (design §15.3) or by an operator
            # from the CLI (§15.2). The host logs "authoring: credential table
            # only". The Phase 0 bootstrap form is still honoured by the code
            # if the variables are ever set again.
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: registry-db, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: registry-db, key: POSTGRES_PASSWORD } }
            - name: DATABASE_URL
              value: 'postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/cp_registry'
            # Sign-in and /account (design §15.3). The origin the Google and
            # GitHub callbacks are registered against; the client ids, client
            # secrets and the session-cookie key come from the registry-oauth
            # secret (deploy/CREDENTIALS.md). With all six present the host
            # mounts /auth/* and /account; with none it runs without sign-in.
            - name: CP_PUBLIC_ORIGIN
              value: 'https://cp.cnscp.io'
          envFrom:
            - secretRef: { name: registry-oauth }
          readinessProbe:
            httpGet: { path: /health, port: 8082 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8082 }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }