# Nightly backups. The namespace is "an archive of contracts: write-once,
# read-rarely, must-never-be-wrong" (§2) — losing it is the one unrecoverable
# failure, and the whole dataset is kilobytes. pg_dump to a PVC, keep 30 days.
#
# The audit chain gives each dump a free integrity check: after any restore,
# `SELECT * FROM audit_chain_verify(1)` returning zero rows proves the history
# is exactly what was written (§4.3).

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-backups
  namespace: cp-registry
spec:
  accessModes: ['ReadWriteOnce']
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: registry-backup
  namespace: cp-registry
spec:
  schedule: '15 3 * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: postgres:16
              envFrom:
                - secretRef:
                    name: registry-db
              command: ['/bin/sh', '-c']
              args:
                - |
                  set -e
                  STAMP=$(date +%Y%m%d-%H%M%S)
                  export PGPASSWORD="$POSTGRES_PASSWORD"
                  pg_dump -h postgres -U "$POSTGRES_USER" -d cp_registry \
                    | gzip > /backups/cp_registry-$STAMP.sql.gz
                  ls -la /backups/cp_registry-$STAMP.sql.gz
                  # Keep 30 days.
                  find /backups -name 'cp_registry-*.sql.gz' -mtime +30 -delete
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: registry-backups
